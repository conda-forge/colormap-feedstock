{% set name = "colormap" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/colormap-{{ version }}.tar.gz
  sha256: b6a9ae93dff67c44c1715680c8c00a9de05a8e9c556b6219d07fa8418414e7fa

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - setuptools
    - matplotlib-base
    - easydev
    - numpy >=2.0.0,<3.0.0
    - importlib_resources
    
test:
  requires:
    - python {{ python_min }}
  imports:
    colormap

about:
  home: http://packages.python.org/colormap/
  license: LGPL v3+
  license_family: LGPL
  license_file: LICENSE
  summary: 'Utilities to ease manipulation of matplotlib colormaps and color codecs (e.g., hex2rgb)'
  doc_url: http://colormap.readthedocs.io/en/latest
  dev_url: https://github.com/cokelaer/colormap

extra:
  recipe-maintainers:
    - cokelaer
