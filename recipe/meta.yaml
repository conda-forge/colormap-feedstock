{% set name = "colormap" %}
{% set version = "1.3.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/cokelaer/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 796babc19be2ba1953b1aed26fdd99067adbf763ae2193e97e7c5e2209907e4a


build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - poetry-core
  run:
    - python >={{ python_min }}
    - setuptools
    - matplotlib-base >=3.9.2
    - numpy >=2.0.0

test:
  imports:
    colormap
  requires:
    - python {{ python_min }}
    - pip
    - pytest
  source_files:
    - test/
  commands:
    # Skip pip-check until we drop py310.
    # NB: The pins here, to accomocate py<310, seems more like solve issues when new numpy was out
    # rather than real code incompatibilities.
    # The full test suit is running and passing.
    # - pip check
    - pytest

about:
  home: https://pypi.org/project/colormap/
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: 'Utilities to ease manipulation of matplotlib colormaps and color codecs (e.g., hex2rgb)'
  doc_url: http://colormap.readthedocs.io/en/latest
  dev_url: https://github.com/cokelaer/colormap

extra:
  recipe-maintainers:
    - cokelaer
