{% set name = "colormap" %}
{% set version = "1.3.0" %}
{% set python_min = "3.9" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}


build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - poetry-core
  run:
    - python >={{ python_min }}
    - setuptools
    - matplotlib-base
    - easydev

test:
  imports:
    colormap
  requires:
    - python {{ python_min }}
    - numpy <2 #Only for Python < 3.10
    - pip
  commands:
    - pip check

about:
  home: https://pypi.org/project/colormap/
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: LICENSE
  summary: 'Utilities to ease manipulation of matplotlib colormaps and color codecs (e.g., hex2rgb)'
  doc_url: http://colormap.readthedocs.io/en/latest
  dev_url: https://github.com/cokelaer/colormap

extra:
  recipe-maintainers:
    - cokelaer
